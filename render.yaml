services:
  - type: web
    name: career-predictor
    env: python
    region: singapore  # or keep default
    buildCommand: |
      apt-get update && apt-get install -y tesseract-ocr libgl1
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn decisiontree_api:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
